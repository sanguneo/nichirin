[project]
name = "kanao-cli"
version = "0.31.3"
description = "Zero-dependency KakaoTalk reader, TUI, and text sender for Windows and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
kanao = "kanao.cli:main"
kakaoread = "kakaoread.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kanao", "kanao.agent_docs", "kanao.serve", "kanao.tui", "kakaoread", "kakaocommon"]

[tool.setuptools.package-dir]
kakaocommon = "../kakaocommon"

[tool.setuptools.package-data]
kanao = ["agent_docs/*.md"]

[tool.pyright]
include = ["kanao", "kakaoread", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
extraPaths = [".."]
